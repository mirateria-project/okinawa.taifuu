<title>沖縄 台風・交通</title>
<style>
:root{--bg:#f2f9ff;--card:#fff;--ink:#12263a;--sub:#587089;--line:#cfe3f5;--ok:#1fd36b;--part:#ffc400;--stop:#ff3b5c;--acc:#1e90ff;--sea:#bfe6ff;--land:#9be08a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1a2a;--card:#12263a;--ink:#eaf4ff;--sub:#9db6cc;--line:#244560;--sea:#12395a;--land:#2f7d44}}
:root[data-theme="dark"]{--bg:#0b1a2a;--card:#12263a;--ink:#eaf4ff;--sub:#9db6cc;--line:#244560;--sea:#12395a;--land:#2f7d44}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hiragino Sans","Noto Sans JP",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.5;max-width:560px;margin:0 auto;padding:12px 14px 40px}
header{display:flex;align-items:center;gap:8px;justify-content:space-between}
h1{font-size:19px;margin:0}
.badge{display:none;background:var(--stop);color:#fff;border-radius:999px;padding:2px 10px;font-size:13px;font-weight:700}
.badge.on{display:inline-block}
.top-actions{display:flex;gap:6px}
button{font:inherit;cursor:pointer;transition:transform .08s,filter .08s;-webkit-tap-highlight-color:transparent}
button:active,#banner:active{transform:scale(.93) translateY(2px);filter:brightness(.88)}
.ghost{background:var(--card);border:2px solid var(--line);color:var(--ink);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600}
#banner{margin:10px 0;border:2px solid var(--line);border-radius:12px;background:#cfd4da;height:112px;overflow:hidden;position:relative}
#banner .t{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-weight:700;transform:translateX(100%);animation:slide 11s linear infinite;white-space:nowrap}
#banner.glow{animation:glow 1.4s ease-in-out infinite alternate}
@keyframes slide{from{transform:translateX(100%)}to{transform:translateX(-100%)}}
@keyframes glow{from{box-shadow:0 0 0 0 transparent;border-color:var(--line)}to{box-shadow:0 0 14px 3px #ffd60a;border-color:#ffd60a}}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:6px 0 12px}
.tab{padding:12px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--ink);font-size:16px;font-weight:800}
.tab[aria-selected="true"]{background:var(--acc);border-color:var(--acc);color:#fff}
.panel[hidden]{display:none}
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px;font-size:13px;color:var(--sub)}
.go{background:var(--acc);color:#fff;border:0;border-radius:999px;padding:8px 14px;font-weight:700}
.card{border-radius:20px;padding:20px 18px;margin-bottom:12px;color:#fff;transition:background .3s,filter .3s}
.card .n{font-size:15px;font-weight:700;opacity:.95}
.card .s{display:flex;align-items:center;gap:10px;font-size:30px;font-weight:900;margin-top:4px}
.lamp{width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 0 12px 4px #fff8}
.card .d{font-size:13px;margin-top:4px;opacity:.95}
.card.ok{background:var(--ok);color:#06361b}.card.part{background:var(--part);color:#3d2e00}.card.stop{background:var(--stop);filter:grayscale(.55)}
.card.stop .lamp{animation:bl 1s steps(2) infinite}
@keyframes bl{50%{opacity:.25}}
.demo{font-size:12px;color:var(--sub);margin:4px 0}
.demo button{background:var(--card);border:1.5px solid var(--line);color:var(--ink);border-radius:8px;padding:3px 8px;font-size:12px;margin:2px}
.map{background:var(--sea);border-radius:20px;border:2px solid var(--line);overflow:hidden;position:relative;touch-action:pan-x pan-y}
.zc{position:absolute;right:8px;top:8px;display:flex;flex-direction:column;gap:6px;z-index:2}
.zc button{width:40px;height:40px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);font-size:20px;font-weight:800;line-height:1}
.map svg{display:block;width:100%;height:auto;transform-origin:0 0}
.legend{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.chip{border:2px solid var(--c);background:var(--card);color:var(--ink);border-radius:999px;padding:5px 10px;font-weight:800;font-size:14px;display:flex;align-items:center;gap:6px;transition:.2s}
.chip i{width:12px;height:12px;border-radius:50%;background:var(--c)}
.chip.lit{background:var(--c);color:#111}
.chip.lit i{background:#fff}
.ctl{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:10px 14px;margin:8px 0}
.ctl label{display:flex;justify-content:space-between;font-weight:700;font-size:14px}
input[type=range]{width:100%;accent-color:var(--acc)}
.info{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:10px 14px;font-size:14px}
.info b{font-size:16px}
.note{font-size:12px;color:var(--sub);margin-top:8px}
dialog{border:0;border-radius:18px;padding:18px;max-width:420px;width:90%;background:var(--card);color:var(--ink)}
dialog::backdrop{background:#0008}
.ph{background:var(--sea);border-radius:12px;height:160px;display:flex;align-items:center;justify-content:center;color:var(--sub);margin:10px 0}
@media (prefers-reduced-motion:reduce){#banner .t{animation:none;transform:none}.card.stop .lamp,#banner.glow{animation:none}}
.opts{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:12px 14px;margin:10px 0}
.opts h2{font-size:15px;margin:0 0 6px}
.opt{display:flex;align-items:center;gap:12px;padding:10px 6px;border-radius:12px;font-size:16px;font-weight:700;cursor:pointer;transition:transform .08s,background .08s}
.opt:active{transform:scale(.97);background:var(--bg)}
.opt input{width:26px;height:26px;accent-color:var(--acc);flex:none}
#alertbar{position:fixed;left:0;right:0;top:0;z-index:50;padding:calc(10px + env(safe-area-inset-top,0px)) 14px 10px;background:var(--stop);color:#fff;display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:17px;font-weight:900;box-shadow:0 4px 14px #0005}
#alertbar[hidden]{display:none}
#alertbar .go{background:#fff;color:var(--stop);flex:none}
.sea{fill:var(--sea)}.ld{fill:var(--land);stroke:#5aa84e;stroke-width:calc(2px*var(--inv,1))}
.gr{stroke:#fff;stroke-opacity:.9;stroke-width:calc(2.4px*var(--inv,1));fill:none}
.gt{fill:#12263a;fill-opacity:.75;font-size:calc(21px*var(--inv,1));font-weight:800;paint-order:stroke;stroke:#fff;stroke-width:calc(4px*var(--inv,1));stroke-linejoin:round}
.gl{fill:#0b1a2a;font-size:calc(29px*var(--inv,1));font-weight:900;paint-order:stroke;stroke:#fff;stroke-opacity:1;stroke-width:calc(8px*var(--inv,1));stroke-linejoin:round}
.gl.tl{fill:#c4002a;font-size:calc(32px*var(--inv,1))}
.lb{font-size:calc(34px*var(--inv,1));stroke-width:calc(8px*var(--inv,1));stroke-linejoin:round}
#ring{stroke:#12263a;stroke-width:calc(3px*var(--inv,1));stroke-dasharray:calc(12px*var(--inv,1)) calc(12px*var(--inv,1));opacity:.55}
.trk{fill:none;stroke:#12263a;stroke-width:calc(5px*var(--inv,1));stroke-dasharray:calc(14px*var(--inv,1)) calc(12px*var(--inv,1));opacity:.6}
#geo circle[stroke]{stroke-width:calc(4px*var(--inv,1))}
#oimg,#oisl{transition:opacity .25s}
@keyframes cbl{0%,100%{fill-opacity:.5;transform:scale(1)}50%{fill-opacity:.95;transform:scale(1.08)}}
@keyframes hot{0%,100%{fill-opacity:.95;transform:scale(.92)}50%{fill-opacity:.55;transform:scale(1.25)}}
@keyframes cur{0%{transform:scale(.8);opacity:.9}100%{transform:scale(3.4);opacity:0}}
#circles circle,#tyw .cur{transform-box:fill-box;transform-origin:center}
#circles circle.on{animation:cbl 1.2s ease-in-out infinite}
#circles circle.hot{animation:hot .6s ease-in-out infinite}
#tyw .cur{animation:cur 1.4s ease-out infinite}
@media (prefers-reduced-motion:reduce){#circles circle.on,#circles circle.hot,#tyw .cur{animation:none}}
.card.unk{background:#9fb3c8;color:#10243a}.demo{display:none}
.nodata #circles,.nodata #tyw,.nodata #tyt,.nodata #legend{display:none}
.lnk{display:block;text-align:center;margin:8px 0;font-size:14px;font-weight:700;color:var(--acc)}
.top-actions{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end}
#tyw .wa{stroke-width:calc(3px*var(--inv,1))}#tyw .sm{stroke-width:calc(4px*var(--inv,1))}
.card .n,.card .s>span:not(.lamp){font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",system-ui,sans-serif;font-weight:900;color:#fff;-webkit-text-stroke:.16em #10243a;paint-order:stroke fill;letter-spacing:.04em;line-height:1.15}
.card .n{font-size:30px;opacity:1}
.card .s{font-size:min(60px,13.2vw);gap:12px;margin-top:6px}
.lamp{width:28px;height:28px;flex:none}
.card.unk .s{font-size:min(44px,9.6vw)}
.tyinfo{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:12px 14px;margin:10px 0;font-size:15px;line-height:1.7}
.demo{display:block!important}
.spd{display:flex;align-items:center;gap:8px;margin:0 0 12px;font-weight:700;font-size:14px;color:var(--sub)}
.spd .seg{flex:1;display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.spd .seg button{padding:9px 4px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);font-size:15px;font-weight:800}
.spd .seg button.sel{background:var(--acc);border-color:var(--acc);color:#fff}
.tyhd{font-size:19px;font-weight:900;line-height:1.3}
.tynear{font-size:14px;font-weight:800;color:var(--acc);margin-bottom:6px;line-height:1.35}
.tygrid{display:grid;grid-template-columns:1fr 1fr;gap:4px 10px}
.tyr{padding:3px 0;border-bottom:1px solid var(--line);line-height:1.25}
.tyr span{display:block;color:var(--sub);font-weight:700;font-size:12px}.tyr b{font-size:16px}
.tyfc{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:6px;font-size:13px;font-weight:700;line-height:1.3}
.tyfh{width:100%;color:var(--sub);font-size:12px}
.tyfd{display:flex;align-items:center;gap:4px}.tyfd i{width:10px;height:10px;border-radius:50%;flex:none}
.tysep{border:0;border-top:2px dashed var(--line);margin:12px 0}
.tyiss{margin-top:10px;font-size:14px;color:var(--sub)}
.srcbox{margin-top:12px;padding:10px 12px;border-top:2px dashed var(--line);font-size:13px;color:var(--sub);line-height:1.6}
.srcbox p{margin:0 0 6px}
.clk{display:inline-block;margin-top:10px;background:#fff;color:#12263a;border:2px solid #12263a;border-radius:999px;padding:7px 16px;font-size:15px;font-weight:900;text-decoration:none;transition:transform .08s,filter .08s;-webkit-tap-highlight-color:transparent}
.clk:active{transform:scale(.92) translateY(2px);filter:brightness(.85)}
.srcbox a{display:block;font-weight:800;color:var(--acc);padding:4px 0;font-size:14px}
/* compact: map + info on one screen */
#info.tyinfo{padding:8px 10px;margin:6px 0;font-size:13px;line-height:1.4}
#info .tyhd{font-size:16px}
#info .tynear{font-size:12.5px;margin-bottom:2px}
#info .tykey{grid-template-columns:repeat(3,1fr);gap:4px;margin:4px 0}
#info .tyk{padding:3px 2px;border-radius:9px;border-width:1.5px}
#info .tyk span{font-size:10.5px}
#info .tyk b{font-size:16px;margin-top:0}
#info .tyk b small{font-size:10px}
#info .tyk b.na{font-size:11px}
.tyk.d b{color:#12263a}.tyk.s b,.tyk.p b{color:#5a3fd6}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tyk.d b{color:#eaf4ff}}
#info .tymore{margin-top:4px}
#info .tyfar1{font-size:12px;color:var(--sub);line-height:1.35}
#info .tysep{margin:6px 0}
#info .tymore summary{font-size:12.5px;font-weight:800;color:var(--acc);cursor:pointer;padding:2px 0}
#info .tyiss{margin-top:4px;font-size:11.5px;display:inline}
#info br+a,#info a{font-size:12px}
#legend.legend{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin:6px 0}
#legend .chip{padding:5px 2px;font-size:13px;border-width:2px;justify-content:center;gap:3px;white-space:nowrap}
#legend .chip i{width:8px;height:8px}
#legend .chip.sel{transform:scale(1.06);border-width:3px;box-shadow:0 0 0 2px var(--c),0 2px 8px var(--c)}
.tykey{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:8px 0 10px}
.tyk{background:var(--bg);border:2px solid var(--line);border-radius:12px;padding:6px 4px;text-align:center;line-height:1.2}
.tyk span{display:block;font-size:12px;font-weight:800;color:var(--sub)}
.tyk b{display:block;font-size:20px;font-weight:900;margin-top:2px}
.tyk b small{font-size:12px;font-weight:800}
.tyk.g b{color:#e0002a}.tyk.w b{color:#d46b00}.tyk.v b{color:var(--acc)}
.tyk b.na{font-size:13px;color:var(--sub)}
.legend .chip{padding:9px 14px;font-size:16px;border-width:3px;transition:transform .12s,background .15s,opacity .15s,filter .15s,box-shadow .15s}
.legend .chip:active{transform:scale(.86) translateY(4px)!important;filter:brightness(.75)!important;box-shadow:inset 0 3px 6px #0004!important}
.legend .chip.sel{background:var(--c);color:#fff;transform:scale(1.12);border-width:4px;border-color:#12263a;box-shadow:0 0 0 3px var(--c),0 4px 14px var(--c);-webkit-text-stroke:.12em #12263a;paint-order:stroke fill;z-index:1;position:relative}
.legend .chip.sel i{background:#fff;box-shadow:0 0 6px #fff}
.legend .chip.dim{background:#e3e7ec;color:#9aa5b1;border-color:var(--c);opacity:.7;filter:saturate(.35)}
.legend .chip.dim i{background:#b5bec8}
#arw .ab{fill:none;stroke:#fff;stroke-linecap:round;stroke-linejoin:round;stroke-width:calc(12px*var(--inv,1))}
#arw .af{fill:none;stroke:#e0002a;stroke-linecap:round;stroke-linejoin:round;stroke-width:calc(6px*var(--inv,1))}
#arw .ah{fill:#e0002a;stroke:#fff;stroke-linejoin:round;stroke-width:calc(3px*var(--inv,1))}
@keyframes pop{0%{transform:scale(.6)}45%{transform:scale(1.45)}100%{transform:scale(1)}}
#circles circle.pop{animation:pop .5s ease-out}
</style>

<style>
#mira-ban{position:relative;margin:10px 12px 12px 2px;box-sizing:border-box;z-index:5}
#mira-ban[hidden]{display:none!important}
#mira-mq{height:92px;overflow:hidden;border-radius:12px;background:#4a5059;border:2px solid #2e333a;position:relative;cursor:pointer;-webkit-tap-highlight-color:transparent}
#mira-mq:active{filter:brightness(.85)}
#mira-trk{position:absolute;top:0;left:0;height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:2px;white-space:nowrap;will-change:transform;color:#fff;font:800 20px -apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif}
#mira-trk img{height:62px;width:auto;display:block;max-width:none}
#mira-trk small{font-size:12px;font-weight:600;color:#e6eaef}
#mira-bx{position:absolute;top:-12px;right:-10px;width:32px;height:32px;border-radius:50%;border:2px solid #fff;background:#2e333a;color:#fff;font-size:17px;line-height:1;padding:0;box-shadow:0 2px 5px #0006;cursor:pointer;transition:transform .08s}
#mira-bx:active{transform:scale(.88);background:#555c66}
#mira-dlg{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;z-index:9999;padding:16px}
#mira-dlg[hidden]{display:none!important}
#mira-dlg>div{background:#2b3038;border-radius:16px;padding:16px;max-width:520px;width:100%;text-align:center;color:#fff;font-family:-apple-system,BlinkMacSystemFont,sans-serif}
#mira-dlg img{max-width:100%;height:auto;border-radius:8px}
#mira-dlg p{font-size:15px;margin:8px 0 12px;color:#e6eaef}
#mira-dlg button{font-size:18px;font-weight:800;padding:10px 28px;border-radius:999px;border:0;background:#1f6fe0;color:#fff;cursor:pointer}
#mira-dlg button:active{transform:scale(.94);filter:brightness(.85)}
</style>

/* read aloud */
const EN_DIR={'北':'north','北北東':'north-northeast','北東':'northeast','東北東':'east-northeast','東':'east','東南東':'east-southeast','南東':'southeast','南南東':'south-southeast','南':'south','南南西':'south-southwest','南西':'southwest','西南西':'west-southwest','西':'west','西北西':'west-northwest','北西':'northwest','北北西':'north-northwest'};
const EN_SC={'大型':'large','超大型':'very large'},EN_IN={'強い':'strong','非常に強い':'very strong','猛烈な':'violent'};
function tySpeech(t){
 const n=t.now,b=nearest(t),ja=L=='ja',a=[tyName(t)+(ja?'。':'.')];
 a.push(T.spDist(Math.round(dist(n.c))));
 if(n.gust)a.push(T.spGust(n.gust));
 if(n.hpa)a.push(T.spHpa(n.hpa));
 const cs=ja?n.course:EN_DIR[n.course];
 if(n.spd!=null)a.push(T.spSpd(cs,n.spd));else if(n.spdnote)a.push(T.spSlow(n.spdnote));
 if(n.wind)a.push(T.spWind(n.wind));
 if(n.scale&&n.scale!='-')a.push(T.spScale(ja?n.scale:(EN_SC[n.scale]||n.scale)));
 if(n.int&&n.int!='-')a.push(T.spInt(ja?n.int:(EN_IN[n.int]||n.int)));
 if(n.storm)a.push(T.spStorm(n.storm));
 if(ja&&n.loc)a.push(T.spLoc(n.loc));
 a.push(within(t)?T.spNear(b.h,Math.round(b.d)):T.spFar);
 return a.join(' ')}
const RATES=[.95,1.15,1.4];let lastTxt='';
function say(txt){
 const ss=window.speechSynthesis;if(!ss)return;lastTxt=txt;
 ss.cancel();const u=new SpeechSynthesisUtterance(txt);u.lang=L=='ja'?'ja-JP':'en-US';u.rate=RATES[S.rate]??RATES[1];
 const v=ss.getVoices().find(x=>x.lang&&x.lang.replace('_','-').toLowerCase().startsWith(L=='ja'?'ja':'en'));if(v)u.voice=v;
 u.onend=u.onerror=()=>{$('spk').textContent=T.spk};$('spk').textContent=T.spkStop;ss.speak(u)}
$('spk').onclick=()=>{
 const ss=window.speechSynthesis;if(!ss)return;
 if(ss.speaking){ss.cancel();$('spk').textContent=T.spk;return}
 const p=[T.spBus(T.bst[S.bus],S.bus=='unk'),T.spYui(T.st[S.yui],S.yui=='unk')];
 if(S.btxt&&L=='ja')p.push(T.spAssoc(S.btxt));
 const list=tyList();
 if(!S.typ||!Array.isArray(S.typ.typhoons))p.push(T.spUnk);else if(!list.length)p.push(T.spNone);else list.forEach(t=>p.push(tySpeech(t)));
 say(p.join(' '))};
if(!('speechSynthesis' in window))$('spk').style.display='none';
document.querySelectorAll('#spdRow [data-r]').forEach(b=>b.onclick=()=>{S.rate=+b.dataset.r;save();draw();const ss=window.speechSynthesis;if(ss&&ss.speaking&&lastTxt)say(lastTxt)});

let cur=0,timer=null,RAF=0,AN=null;
const still=matchMedia('(prefers-reduced-motion:reduce)').matches;
const SEG=550,HOLD=220,END=1100;
/* ping: rises a little each day */
function ping(k){try{if(!AC||AC.state!='running')return;const t=AC.currentTime,o=AC.createOscillator(),o2=AC.createOscillator(),g=AC.createGain();
 const f=1250*Math.pow(1.12,k);o.type='sine';o.frequency.value=f;o2.type='sine';o2.frequency.value=f*2;
 g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.07,t+.008);g.gain.exponentialRampToValueAtTime(.0001,t+.35);
 o.connect(g);o2.connect(g);g.connect(AC.destination);o.start(t);o2.start(t);o.stop(t+.4);o2.stop(t+.4)}catch(e){}}
/* lit: number of days reached (0-5); hot: day that just arrived */
function light(lit,hot){
 cur=lit;
 g.querySelectorAll('circle').forEach(el=>{
  const i=+el.dataset.d,pin=S.pin>=0;
  const on=pin?(i==S.pin&&lit>i):i<lit;
  const dimmed=pin&&i!=S.pin;
  el.setAttribute('fill',dimmed?'#9aa5b1':COL[i]);el.setAttribute('stroke',dimmed?'#9aa5b1':COL[i]);
  el.setAttribute('fill-opacity',on?'.8':(dimmed?'.08':'.14'));el.setAttribute('stroke-opacity',on?'1':(dimmed?'.3':'.4'));
  el.style.filter=on?'drop-shadow(0 0 10px '+COL[i]+')':'none';
  el.classList.toggle('on',on&&!still&&i!==hot);
  if(i===hot&&!still){el.classList.remove('pop');void el.getBBox();el.classList.add('pop')}});
 $('nums').querySelectorAll('text').forEach((tx,j)=>{const i=+tx.textContent-1;tx.style.opacity=(S.pin>=0&&i!=S.pin)?'.35':'1'});
 lg.querySelectorAll('.chip').forEach((c,i)=>{const pin=S.pin>=0;
  c.classList.toggle('sel',pin&&i==S.pin);c.classList.toggle('dim',pin&&i!=S.pin);c.classList.toggle('lit',!pin&&i<lit)});}
function drawArrow(prog){/* prog: segments travelled (float) */
 const A=$('arw');while(A.firstChild)A.removeChild(A.firstChild);
 PATHS.forEach(P=>{const p=P.pts;if(p.length<2)return;const m=Math.min(prog,p.length-1);if(m<=0)return;
  const k=Math.floor(m),f=m-k,trail=p.slice(0,k+1);
  let h=p[k];if(f>0&&k+1<p.length){h=[p[k][0]+(p[k+1][0]-p[k][0])*f,p[k][1]+(p[k+1][1]-p[k][1])*f];trail.push(h)}
  const prev=trail.length>1?trail[trail.length-2]:p[0];const ang=Math.atan2(h[1]-prev[1],h[0]-prev[0]);
  const pt=trail.map(q=>q[0].toFixed(1)+','+q[1].toFixed(1)).join(' ');
  A.appendChild(sv2('polyline',{class:'ab',points:pt}));A.appendChild(sv2('polyline',{class:'af',points:pt}));
  const sc=1/Math.max(1,Z.s),L1=22*sc,W1=13*sc,c=Math.cos(ang),s2=Math.sin(ang);
  const tip=[h[0]+c*L1*.55,h[1]+s2*L1*.55],bl=[h[0]-c*L1*.45-s2*W1,h[1]-s2*L1*.45+c*W1],br=[h[0]-c*L1*.45+s2*W1,h[1]-s2*L1*.45-c*W1];
  A.appendChild(sv2('polygon',{class:'ah',points:[tip,bl,br].map(q=>q[0].toFixed(1)+','+q[1].toFixed(1)).join(' ')}))})}
function maxSegs(){return PATHS.reduce((a,P)=>Math.max(a,P.pts.length-1),0)}
function dayAt(seg){for(const P of PATHS)if(P.days[seg-1]!=null)return P.days[seg-1];return seg-1}
function restart(){
 cancelAnimationFrame(RAF);clearInterval(timer);
 const N=maxSegs(),goal=S.pin>=0?Math.min(N,(PATHS[0]?PATHS[0].days.indexOf(S.pin):-1)+1||S.pin+1):N;
 if(!N){drawArrow(0);light(0);return}
 if(still){drawArrow(goal);light(S.pin>=0?S.pin+1:5);return}
 AN={t0:performance.now(),seg:0,goal};drawArrow(0);light(0);
 const step=now=>{const e=now-AN.t0,per=SEG+HOLD;
  if(AN.seg>=AN.goal){if(e>=END){AN.t0=now;AN.seg=0;drawArrow(0);light(0)}RAF=requestAnimationFrame(step);return}
  const inSeg=Math.min(1,e/SEG);drawArrow(AN.seg+inSeg);
  if(e>=SEG&&!AN.arr){AN.arr=1;const d=dayAt(AN.seg+1);light(Math.max(cur,d+1),d);ping(d)}
  if(e>=per){AN.seg++;AN.arr=0;AN.t0=now}
  RAF=requestAnimationFrame(step)};
 RAF=requestAnimationFrame(step)}
document.addEventListener('visibilitychange',()=>{if(document.hidden)cancelAnimationFrame(RAF);else restart()});

/* map pinch zoom / pan */
const mp=document.querySelector('.map'),sv=$('svg'),Z={s:1,x:0,y:0},P=new Map();let d0=0,s0=1;
function ap(){const w=mp.clientWidth,h=mp.clientHeight;Z.s=Math.min(60,Math.max(1,Z.s));
 if(Z.s<1){Z.x=(w-w*Z.s)/2;Z.y=(h-h*Z.s)/2}else{Z.x=Math.min(0,Math.max(w-w*Z.s,Z.x));Z.y=Math.min(0,Math.max(h-h*Z.s,Z.y))}

 sv.style.setProperty('--inv',1/Math.max(1,Z.s));}
function zoomAt(cx,cy,ns){ns=Math.min(60,Math.max(1,ns));const k=ns/Z.s;Z.x=cx-(cx-Z.x)*k;Z.y=cy-(cy-Z.y)*k;Z.s=ns;ap()}
function rel(e){const r=mp.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]}
mp.addEventListener('pointerdown',e=>{if(e.target.closest('.zc'))return;P.set(e.pointerId,{x:e.clientX,y:e.clientY});try{mp.setPointerCapture(e.pointerId)}catch(_){}
 if(P.size==2){const[a,b]=[...P.values()];d0=Math.hypot(a.x-b.x,a.y-b.y);s0=Z.s}});
mp.addEventListener('pointermove',e=>{const p=P.get(e.pointerId);if(!p)return;
 if(P.size==2){p.x=e.clientX;p.y=e.clientY;const[a,b]=[...P.values()];const d=Math.hypot(a.x-b.x,a.y-b.y);
  const r=mp.getBoundingClientRect();if(d0>0)zoomAt((a.x+b.x)/2-r.left,(a.y+b.y)/2-r.top,s0*d/d0)}
 else if(Z.s>1){Z.x+=e.clientX-p.x;Z.y+=e.clientY-p.y;p.x=e.clientX;p.y=e.clientY;ap()}});
['pointerup','pointercancel'].forEach(t=>mp.addEventListener(t,e=>{P.delete(e.pointerId)}));
mp.addEventListener('dblclick',e=>{if(e.target.closest('.zc'))return;const[x,y]=rel(e);Math.abs(Z.s-1)>.01?(Z.s=1,Z.x=0,Z.y=0,ap()):zoomAt(x,y,2.5)});

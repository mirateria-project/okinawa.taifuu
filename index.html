<title>沖縄 台風・交通</title>
<style>
:root{--bg:#f2f9ff;--card:#fff;--ink:#12263a;--sub:#587089;--line:#cfe3f5;--ok:#1fd36b;--part:#ffc400;--stop:#ff3b5c;--acc:#1e90ff;--sea:#bfe6ff;--land:#9be08a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1a2a;--card:#12263a;--ink:#eaf4ff;--sub:#9db6cc;--line:#244560;--sea:#12395a;--land:#2f7d44}}
:root[data-theme="dark"]{--bg:#0b1a2a;--card:#12263a;--ink:#eaf4ff;--sub:#9db6cc;--line:#244560;--sea:#12395a;--land:#2f7d44}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hiragino Sans","Noto Sans JP",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.5;max-width:560px;margin:0 auto;padding:12px 14px 40px}
header{display:flex;align-items:center;gap:8px;justify-content:space-between}

button{font:inherit;cursor:pointer;transition:transform .08s,filter .08s;-webkit-tap-highlight-color:transparent}

.ghost{background:var(--card);border:2px solid var(--line);color:var(--ink);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600}
#banner{margin:10px 0;border:2px solid var(--line);border-radius:12px;background:#cfd4da;height:112px;overflow:hidden;position:relative}

@keyframes slide{from{transform:translateX(100%)}to{transform:translateX(-100%)}}
@keyframes glow{from{box-shadow:0 0 0 0 transparent;border-color:var(--line)}to{box-shadow:0 0 14px 3px #ffd60a;border-color:#ffd60a}}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:6px 0 12px}
.tab{padding:12px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--ink);font-size:16px;font-weight:800}
.tab[aria-selected="true"]{background:var(--acc);border-color:var(--acc);color:#fff}
.panel[hidden]{display:none}
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px;font-size:13px;color:var(--sub)}

.card.ok{background:var(--ok);color:#06361b}.card.part{background:var(--part);color:#3d2e00}.card.stop{background:var(--stop);filter:grayscale(.55)}

.demo{font-size:12px;color:var(--sub);margin:4px 0}
.demo button{background:var(--card);border:1.5px solid var(--line);color:var(--ink);border-radius:8px;padding:3px 8px;font-size:12px;margin:2px}
.map{background:var(--sea);border-radius:20px;border:2px solid var(--line);overflow:hidden;position:relative;touch-action:pan-x pan-y}

.map svg{display:block;width:100%;height:auto;transform-origin:0 0}
.swc{fill:#ff2d2d;fill-opacity:.07;stroke:#e00000;stroke-width:calc(4px*var(--inv,1));transform-box:fill-box;transform-origin:center}
.swc.swpop{animation:swpop .45s ease-out}

.mk{display:flex;flex-direction:column;gap:2px}.mko{display:flex;flex-wrap:wrap;gap:0 10px}
.mk i{display:inline-block;width:20px;height:12px;border-radius:50%;flex:none}
.kfc{border:2px dashed #fff;background:#8899aa55}.ksw{border:2px solid #e00000}
.co{font-size:calc(26px*var(--inv,1));font-weight:900;paint-order:stroke;stroke:#fff;stroke-width:calc(7px*var(--inv,1));stroke-linejoin:round}
.col{stroke:#fff;stroke-width:calc(3px*var(--inv,1));fill:none;filter:drop-shadow(0 0 1.5px #0009)}
.cod{stroke:#fff;stroke-width:calc(2px*var(--inv,1))}
.mapkey{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;font-weight:700;color:var(--sub,#55657f);padding:2px 4px}
.mapkey span{display:inline-flex;align-items:center;gap:6px}

.legend{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.chip{border:2px solid var(--c);background:var(--card);color:var(--ink);border-radius:999px;padding:5px 10px;font-weight:800;font-size:14px;display:flex;align-items:center;gap:6px;transition:.2s}

.ctl{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:10px 14px;margin:8px 0}
.ctl label{display:flex;justify-content:space-between;font-weight:700;font-size:14px}
input[type=range]{width:100%;accent-color:var(--acc)}
.info{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:10px 14px;font-size:14px}
.info b{font-size:16px}
.note{font-size:12px;color:var(--sub);margin-top:8px}
dialog{border:0;border-radius:18px;padding:18px;max-width:420px;width:90%;background:var(--card);color:var(--ink)}
dialog::backdrop{background:#0008}
.ph{background:var(--sea);border-radius:12px;height:160px;display:flex;align-items:center;justify-content:center;color:var(--sub);margin:10px 0}
@media (prefers-reduced-motion:reduce){#banner .t{animation:none;transform:none}.card.stop .lamp,#banner.glow{animation:none}}
.opts{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:12px 14px;margin:10px 0}
.opts h2{font-size:15px;margin:0 0 6px}
.opt{display:flex;align-items:center;gap:12px;padding:10px 6px;border-radius:12px;font-size:16px;font-weight:700;cursor:pointer;transition:transform .08s,background .08s}
.opt:active{transform:scale(.97);background:var(--bg)}
.opt input{width:26px;height:26px;accent-color:var(--acc);flex:none}
#alertbar{position:fixed;left:0;right:0;top:0;z-index:50;padding:calc(10px + env(safe-area-inset-top,0px)) 14px 10px;background:var(--stop);color:#fff;display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:17px;font-weight:900;box-shadow:0 4px 14px #0005}
#alertbar[hidden]{display:none}
#alertbar .go{background:#fff;color:var(--stop);flex:none}
.sea{fill:var(--sea)}.ld{fill:var(--land);stroke:#5aa84e;stroke-width:calc(2px*var(--inv,1))}
.gr{stroke:#fff;stroke-opacity:.9;stroke-width:calc(2.4px*var(--inv,1));fill:none}
.gt{fill:#12263a;fill-opacity:.75;font-size:calc(21px*var(--inv,1));font-weight:800;paint-order:stroke;stroke:#fff;stroke-width:calc(4px*var(--inv,1));stroke-linejoin:round}
.gl{fill:#0b1a2a;font-size:calc(29px*var(--inv,1));font-weight:900;paint-order:stroke;stroke:#fff;stroke-opacity:1;stroke-width:calc(8px*var(--inv,1));stroke-linejoin:round}
.gl.tl{fill:#c4002a;font-size:calc(32px*var(--inv,1))}
.lb{font-size:calc(34px*var(--inv,1));stroke-width:calc(8px*var(--inv,1));stroke-linejoin:round}
#ring{stroke:#12263a;stroke-width:calc(3px*var(--inv,1));stroke-dasharray:calc(12px*var(--inv,1)) calc(12px*var(--inv,1));opacity:.55}
.trk{fill:none;stroke:#12263a;stroke-width:calc(5px*var(--inv,1));stroke-dasharray:calc(14px*var(--inv,1)) calc(12px*var(--inv,1));opacity:.6}
#geo circle[stroke]{stroke-width:calc(4px*var(--inv,1))}
#oimg,#oisl{transition:opacity .25s}
@keyframes cbl{0%,100%{fill-opacity:.5;transform:scale(1)}50%{fill-opacity:.95;transform:scale(1.08)}}
@keyframes hot{0%,100%{fill-opacity:.95;transform:scale(.92)}50%{fill-opacity:.55;transform:scale(1.25)}}
@keyframes cur{0%{transform:scale(.8);opacity:.9}100%{transform:scale(3.4);opacity:0}}
#circles circle,#tyw .cur{transform-box:fill-box;transform-origin:center}
#circles circle.on{animation:cbl 1.2s ease-in-out infinite}
#circles circle.hot{animation:hot .6s ease-in-out infinite}
#tyw .cur{animation:cur 1.4s ease-out infinite}
@media (prefers-reduced-motion:reduce){#circles circle.on,#circles circle.hot,#tyw .cur{animation:none}}
.card.unk{background:#9fb3c8;color:#10243a}.demo{display:none}
.nodata #circles,.nodata #tyw,.nodata #tyt,.nodata #legend{display:none}
.lnk{display:block;text-align:center;margin:8px 0;font-size:14px;font-weight:700;color:var(--acc)}
.top-actions{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end}
#tyw .wa{stroke-width:calc(3px*var(--inv,1))}#tyw .sm{stroke-width:calc(4px*var(--inv,1))}
.card .n,.card .s>span:not(.lamp){font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",system-ui,sans-serif;font-weight:900;color:#fff;-webkit-text-stroke:.16em #10243a;paint-order:stroke fill;letter-spacing:.04em;line-height:1.15}
.card .n{font-size:30px;opacity:1}

.lamp{width:28px;height:28px;flex:none}

.tyinfo{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:12px 14px;margin:10px 0;font-size:15px;line-height:1.7}
.demo{display:block!important}
.spd{display:flex;align-items:center;gap:8px;margin:0 0 12px;font-weight:700;font-size:14px;color:var(--sub)}
.spd .seg{flex:1;display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.spd .seg button{padding:9px 4px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);font-size:15px;font-weight:800}

.tyhd{font-size:19px;font-weight:900;line-height:1.3}
.tynear{font-size:14px;font-weight:800;color:var(--acc);margin-bottom:6px;line-height:1.35}

.tyfc{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:6px;font-size:13px;font-weight:700;line-height:1.3}
.tyfh{width:100%;color:var(--sub);font-size:12px}
.tyfd{display:flex;align-items:center;gap:4px}.tyfd i{width:10px;height:10px;border-radius:50%;flex:none}
.tysep{border:0;border-top:2px dashed var(--line);margin:12px 0}

.srcbox{margin-top:12px;padding:10px 12px;border-top:2px dashed var(--line);font-size:13px;color:var(--sub);line-height:1.6}

.caut{margin:8px 0 10px;padding:10px 12px;border-radius:12px;background:#fff4c2;border:2px solid #f0b400;color:#5a4300;font-weight:800;font-size:15px;line-height:1.5;text-align:center;animation:cautP 2.6s ease-in-out infinite}
@keyframes cautP{0%,100%{opacity:1;box-shadow:0 0 0 0 rgba(240,180,0,0)}50%{opacity:.55;box-shadow:0 0 14px 2px rgba(240,180,0,.55)}}

.clk{display:inline-block;margin-top:10px;background:#fff;color:#12263a;border:2px solid #12263a;border-radius:999px;padding:7px 16px;font-size:15px;font-weight:900;text-decoration:none;transition:transform .08s,filter .08s;-webkit-tap-highlight-color:transparent}
.clk:active{transform:scale(.92) translateY(2px);filter:brightness(.85)}

/* compact: map + info on one screen */
#info.tyinfo{padding:8px 10px;margin:6px 0;font-size:13px;line-height:1.4}

.tykey{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:8px 0 10px}
.tyk{background:var(--bg);border:2px solid var(--line);border-radius:12px;padding:6px 4px;text-align:center;line-height:1.2}
.tyk span{display:block;font-size:12px;font-weight:800;color:var(--sub)}
.tyk b{display:block;font-size:20px;font-weight:900;margin-top:2px}

.legend .chip{padding:9px 14px;font-size:16px;border-width:3px;transition:transform .12s,background .15s,opacity .15s,filter .15s,box-shadow .15s}
.legend .chip:active{transform:scale(.86) translateY(4px)!important;filter:brightness(.75)!important;box-shadow:inset 0 3px 6px #0004!important}

#arw .ab{fill:none;stroke:#fff;stroke-linecap:round;stroke-linejoin:round;stroke-width:calc(12px*var(--inv,1))}

<h3 style="margin:6px 0">できること</h3>
<ul style="padding-left:20px;line-height:1.7;margin:0 0 8px">
<li>バス・ゆいレールの運行状況を色で確認</li>
<li>運休になったら、音・画面・声でお知らせ（オン・オフを選べる）</li>
<li>台風の進路を1〜5日目の色分けで、矢印と一緒に順番に表示</li>
<li>くわしい地図（OpenStreetMap）。拡大・縮小、自分の地域・日本全体・太平洋全体の切り替え</li>
<li>台風を選んで追いかけて表示。台風と日本が入る大きさに自動で調整</li>
<li>台風と沖縄本島（または現在地）の距離を線と数字で表示</li>
<li>現在地を取得すると、何日何時間後に暴風域に入るおそれがあるかを表示</li>
<li>温帯低気圧に変わったことを表示</li>
<li>台風と竜巻を切り替えて表示（上の2つの枠をタップ）。竜巻が近いと赤くお知らせ</li>
<li>地図の🔒で、地図を固定／動かすを切り替え</li>
<li>予報円・暴風警戒域・今の暴風域の表示を切り替え</li>
<li>読み上げ（速さ3段階）・効果音を消すこともできる</li>
<li>通信がなくても開ける（最後に取得した内容を表示）</li>
<li>日本語・英語（自動で切り替え）。海外でも使える</li>
<li>無料</li></ul><h3 style="margin:6px 0">対応地域</h3><ul style="padding-left:20px;line-height:1.7;margin:0 0 8px"><li>台風・暴風域：日本・台湾・フィリピン・中国・韓国・グアム（北西太平洋）</li><li>対象外：アメリカのハリケーン、インドやオーストラリアのサイクロン</li><li>竜巻：日本とアメリカ</li><li>バス・ゆいレール：沖縄だけ</li></ul>

<h3 style="margin:6px 0">What it does</h3>
<ul style="padding-left:20px;line-height:1.7;margin:0 0 8px">
<li>Bus and Yui Rail status at a glance, by color</li>
<li>Sound, screen and voice alerts when service stops (each can be turned on or off)</li>
<li>Typhoon track for days 1 to 5, in colors, with an animated arrow</li>
<li>Detailed map (OpenStreetMap): zoom, and switch between my area, Japan and the whole Pacific</li>
<li>Choose a typhoon and follow it. The map fits the typhoon and Japan automatically</li>
<li>Distance from the typhoon to Okinawa Island (or your location), as a line and a number</li>
<li>Get your location to see in how many days and hours storm winds may reach you</li>
<li>Shows when a typhoon becomes an extratropical low</li>
<li>Switch between typhoon and tornado maps (tap the two boxes at the top). The tornado box turns red when one is likely near you</li>
<li>🔒 on the map: lock or unlock moving the map</li>
<li>Turn forecast circles, storm warning areas and the current storm area on or off</li>
<li>Read aloud (3 speeds), and you can mute sound effects</li>
<li>Opens without a connection (shows the last information received)</li>
<li>Japanese and English (automatic). Works outside Japan too</li>
<li>Free</li></ul><h3 style="margin:6px 0">Coverage</h3><ul style="padding-left:20px;line-height:1.7;margin:0 0 8px"><li>Typhoons &amp; storm areas: Japan, Taiwan, the Philippines, China, Korea, Guam (Northwest Pacific)</li><li>Not covered: US hurricanes, Indian and Australian cyclones</li><li>Tornadoes: Japan and the US</li><li>Bus &amp; Yui Rail: Okinawa only</li></ul>

/* ---------- tornado: JMA tornado nowcast tiles + US NWS warnings ---------- */
const TR={b:null,v:null,ok:null,near:null,us:null};
async function tornado(){
 try{const r=await fetch('https://www.jma.go.jp/bosai/jmatile/data/nowc/targetTimes_N3.json',{cache:'no-store'});if(!r.ok)throw 0;const a=await r.json();
  const c=a.filter(x=>x&&x.basetime&&x.validtime&&(!x.elements||x.elements.includes('trns'))).sort((x,y)=>(y.basetime+y.validtime).localeCompare(x.basetime+x.validtime));
  const best=c.find(x=>x.basetime==x.validtime)||c[c.length-1];if(!best)throw 0;
  const nb=best.basetime!=TR.b||best.validtime!=TR.v;TR.b=best.basetime;TR.v=best.validtime;TR.ok=1;if(nb)ttiles(true)}
 catch(e){TR.ok=0}
 TR.near=null;
 if(TR.ok&&S.me)try{TR.near=await trSample(+S.me.lat,+S.me.lon)}catch(e){TR.near=null}
 TR.us=null;
 const ref=REF();if(ref[0]<-50&&ref[0]>-170&&ref[1]>15)try{const r=await fetch('https://api.weather.gov/alerts/active?point='+ref[1].toFixed(4)+','+ref[0].toFixed(4),{headers:{Accept:'application/geo+json'}});if(r.ok){const j=await r.json();TR.us=(j.features||[]).map(f=>f.properties&&f.properties.event).filter(x=>x&&/tornado/i.test(x))}}catch(e){}
 drawTr()}
const trURL=(z,x,y)=>'https://www.jma.go.jp/bosai/jmatile/data/nowc/'+TR.b+'/none/'+TR.v+'/surf/trns/'+z+'/'+x+'/'+y+'.png';
/* look at the tornado tile pixels around your location (needs the tile to be readable; otherwise just shows the map) */
async function trSample(la,lo){const z=8,n=256,X=WX(lo),Y=WY(la),tx=Math.floor(X/n),ty=Math.floor(Y/n);
 const r=await fetch(trURL(z,tx,ty),{cache:'no-store'});if(r.status==404)return false;if(!r.ok)throw 0;const bl=await r.blob();const bm=await createImageBitmap(bl);
 const cv=document.createElement('canvas');cv.width=bm.width;cv.height=bm.height;const cx=cv.getContext('2d');cx.drawImage(bm,0,0);
 const ix=Math.floor((X-tx*n)*bm.width/n),iy=Math.floor((Y-ty*n)*bm.height/n),R=6;
 const d=cx.getImageData(Math.max(0,ix-R),Math.max(0,iy-R),R*2+1,R*2+1).data;for(let i=3;i<d.length;i+=4)if(d[i]>40)return true;return false}
function drawTr(){const b=$('trBox');let h='<b>🌪 '+T.trT+'</b><br>';
 if(TR.us&&TR.us.length)h+='<span class="trw">'+T.trUS(TR.us.join(', '))+'</span><br>';
 if(TR.near===true)h+='<span class="trw">'+T.trNear+'</span><br>';
 if(TR.ok)h+=T.trOk+(TR.near===false?'<br>'+T.trClear:'')+(!S.me?'<br>'+T.trLoc:'');
 else if(TR.ok===0)h+=T.trFail;
 if(TR.us&&!TR.us.length)h+='<br>'+T.trUSnone;
 h+='<br><a href="https://www.jma.go.jp/bosai/nowc/#elem=trns" target="_blank" rel="noopener">'+T.trLink+'</a>';
 b.innerHTML=h;b.classList.toggle('warn',TR.near===true||!!(TR.us&&TR.us.length));drawTrHalf()}

const TILES=new Map(),TT=new Map();let tz=-1,tz2=-1,tOK=0,tNG=0;
function tileRange(z){const n=1<<z,ts=WS/n,k=K(),x0=V.cx-MW/2/k,x1=V.cx+MW/2/k,y0=V.cy-MH/2/k,y1=V.cy+MH/2/k;
 return {n,ts,a:Math.floor(x0/ts),b:Math.floor(x1/ts),c:Math.max(0,Math.floor(y0/ts)),d:Math.min(n-1,Math.floor(y1/ts))}}
function tiles(){const z=Math.max(2,Math.min(ZMAX,Math.round(V.z+.25))),G=$('tiles'),O=$('tiles0');
 if(z!=tz){/* keep the old zoom under the new one until it loads */
  while(O.firstChild)O.removeChild(O.firstChild);[...G.children].forEach(e=>O.appendChild(e));TILES.clear();tz=z;clearTimeout(tiles.t);tiles.t=setTimeout(()=>{while(O.firstChild)O.removeChild(O.firstChild)},1500)}
 const R=tileRange(z),want=new Set();if((R.b-R.a+1)*(R.d-R.c+1)>90)return;
 for(let x=R.a;x<=R.b;x++)for(let y=R.c;y<=R.d;y++){const xx=((x%R.n)+R.n)%R.n,key=x+'/'+y;want.add(key);if(TILES.has(key))continue;
  const im=document.createElementNS(NSV,'image');im.setAttribute('x',x*R.ts);im.setAttribute('y',y*R.ts);im.setAttribute('width',R.ts*1.004);im.setAttribute('height',R.ts*1.004);im.setAttribute('preserveAspectRatio','none');
  im.addEventListener('load',()=>{tOK++;sv.classList.remove('notiles')});im.addEventListener('error',()=>{tNG++;im.remove();if(tNG>3&&tOK==0)sv.classList.add('notiles')});
  im.setAttribute('href','https://tile.openstreetmap.org/'+z+'/'+xx+'/'+y+'.png');G.appendChild(im);TILES.set(key,im)}
 TILES.forEach((im,k)=>{if(!want.has(k)){im.remove();TILES.delete(k)}});
 if(!navigator.onLine&&tOK==0)sv.classList.add('notiles');
 ttiles()}
function ttiles(force){const G=$('ttiles');if(force){while(G.firstChild)G.removeChild(G.firstChild);TT.clear();tz2=-1}
 if(!TR.ok||!TR.b||S.mode!='tr')return;const z=Math.max(4,Math.min(10,Math.round(V.z)));if(z!=tz2){while(G.firstChild)G.removeChild(G.firstChild);TT.clear();tz2=z}
 const R=tileRange(z),want=new Set();if((R.b-R.a+1)*(R.d-R.c+1)>60)return;
 for(let x=R.a;x<=R.b;x++)for(let y=R.c;y<=R.d;y++){const xx=((x%R.n)+R.n)%R.n,key=x+'/'+y;want.add(key);if(TT.has(key))continue;
  /* the nowcast only covers Japan */
  const lo0=xx/R.n*360-180,lo1=(xx+1)/R.n*360-180;if(lo1<118||lo0>150)continue;
  const im=document.createElementNS(NSV,'image');im.setAttribute('x',x*R.ts);im.setAttribute('y',y*R.ts);im.setAttribute('width',R.ts);im.setAttribute('height',R.ts);im.setAttribute('preserveAspectRatio','none');im.setAttribute('opacity','.85');
  im.addEventListener('error',()=>im.remove());im.setAttribute('href',trURL(z,xx,y));G.appendChild(im);TT.set(key,im)}
 TT.forEach((im,k)=>{if(!want.has(k)){im.remove();TT.delete(k)}})}

let zDrawn=V.z,rq=0;
function ap(){const r=mp.getBoundingClientRect();if(r.width)MW=r.width;if(r.height)MH=r.height;
 V.z=Math.min(ZMAX,Math.max(ZMIN,V.z));
 const k=K(),lo=WX(60),hi=WX(-31),la=WY(62),lb=WY(-15);V.cx=Math.min(hi,Math.max(lo,V.cx));V.cy=Math.min(lb,Math.max(la,V.cy));

 sv.style.setProperty('--inv',(MW/720)/k);sv.classList.toggle('zhi',V.z>=6.5);
 tiles();
 if(Math.abs(V.z-zDrawn)>.02&&!rq){rq=requestAnimationFrame(()=>{rq=0;zDrawn=V.z;drawTy()})}}
function zoomAt(sx,sy,nz){nz=Math.min(ZMAX,Math.max(ZMIN,nz));const k0=K(),wx=V.cx+(sx-MW/2)/k0,wy=V.cy+(sy-MH/2)/k0;V.z=nz;const k1=K();V.cx=wx-(sx-MW/2)/k1;V.cy=wy-(sy-MH/2)/k1;ap()}
function centerOn(lo,la,z){V.cx=WX(lo);V.cy=WY(la);if(z!=null)V.z=z;ap()}
function fit(lo0,la0,lo1,la1,pad){const r=mp.getBoundingClientRect();if(r.width){MW=r.width;MH=r.height}
 const x0=WX(Math.min(lo0,lo1)),x1=WX(Math.max(lo0,lo1)),y0=WY(Math.max(la0,la1)),y1=WY(Math.min(la0,la1)),p=pad==null?.12:pad;
 const w=Math.max(1,x1-x0),h=Math.max(1,y1-y0),k=Math.min(MW*(1-2*p)/w,MH*(1-2*p)/h);
 V.z=Math.min(9,Math.max(ZMIN,8+Math.log2(k)));V.cx=(x0+x1)/2;V.cy=(y0+y1)/2;ap()}

/* read aloud */
const EN_DIR={'北':'north','北北東':'north-northeast','北東':'northeast','東北東':'east-northeast','東':'east','東南東':'east-southeast','南東':'southeast','南南東':'south-southeast','南':'south','南南西':'south-southwest','南西':'southwest','西南西':'west-southwest','西':'west','西北西':'west-northwest','北西':'northwest','北北西':'north-northwest'};
const EN_SC={'大型':'large','超大型':'very large'},EN_IN={'強い':'strong','非常に強い':'very strong','猛烈な':'violent'};
function tySpeech(t){
 const n=t.now,b=nearest(t),ja=L=='ja',a=[tyName(t)+(ja?'。':'.')];
 a.push(T.spDist(Math.round(distRef(n.c))));
 if(n.gust)a.push(T.spGust(n.gust));
 if(n.hpa)a.push(T.spHpa(n.hpa));
 const cs=ja?n.course:EN_DIR[n.course];
 if(n.spd!=null)a.push(T.spSpd(cs,n.spd));else if(n.spdnote)a.push(T.spSlow(n.spdnote));
 if(n.wind)a.push(T.spWind(n.wind));
 if(n.scale&&n.scale!='-')a.push(T.spScale(ja?n.scale:(EN_SC[n.scale]||n.scale)));
 if(n.int&&n.int!='-')a.push(T.spInt(ja?n.int:(EN_IN[n.int]||n.int)));
 if(n.storm)a.push(T.spStorm(n.storm));
 if(ja&&n.loc)a.push(T.spLoc(n.loc));
 a.push(within(t)?T.spNear(b.h,Math.round(b.d)):T.spFar);
 return a.join(' ')}
const RATES=[.95,1.15,1.4];let lastTxt='';
function say(txt){
 const ss=window.speechSynthesis;if(!ss)return;lastTxt=txt;
 ss.cancel();const u=new SpeechSynthesisUtterance(txt);u.lang=L=='ja'?'ja-JP':'en-US';u.rate=RATES[S.rate]??RATES[1];
 const v=ss.getVoices().find(x=>x.lang&&x.lang.replace('_','-').toLowerCase().startsWith(L=='ja'?'ja':'en'));if(v)u.voice=v;
 u.onend=u.onerror=()=>{$('spk').textContent=T.spk};$('spk').textContent=T.spkStop;ss.speak(u)}
$('spk').onclick=()=>{
 const ss=window.speechSynthesis;if(!ss)return;
 if(ss.speaking){ss.cancel();$('spk').textContent=T.spk;return}
 const p=[T.spBus(T.bst[S.bus],S.bus=='unk'),T.spYui(T.st[S.yui],S.yui=='unk')];
 if(S.btxt&&L=='ja')p.push(T.spAssoc(S.btxt));
 const list=tyList();
 if(!S.typ||!Array.isArray(S.typ.typhoons))p.push(T.spUnk);else if(!list.length)p.push(T.spNone);else list.forEach(t=>p.push(isExtra(t)?T.spEx(baseName(t)):tySpeech(t)));
 const em=etaMsg();if(em&&em.lvl!='na')p.push(em.say);if(TR.near===true||(TR.us&&TR.us.length))p.push(T.spTr);
 say(p.join(' '))};
if(!('speechSynthesis' in window))$('spk').style.display='none';
document.querySelectorAll('#spdRow [data-r]').forEach(b=>b.onclick=()=>{S.rate=+b.dataset.r;save();draw();const ss=window.speechSynthesis;if(ss&&ss.speaking&&lastTxt)say(lastTxt)});

$('lbtn').onclick=()=>{try{localStorage.setItem('oktLang',L=='ja'?'en':'ja')}catch(e){}save();try{speechSynthesis.cancel()}catch(e){}location.reload()};

const still=matchMedia('(prefers-reduced-motion:reduce)').matches;
const SEG=550,HOLD=220,END=1100;
/* sound: soft "gyuin" while the arrow grows, soft "pin" on arrival (quiet so speech stays clear) */
function acOK(){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state!='running')AC.resume();return AC.state=='running'}catch(e){return false}}
function ping(k){try{if(S.mute||!acOK())return;const t=AC.currentTime,o=AC.createOscillator(),o2=AC.createOscillator(),g=AC.createGain();
 const f=1250*Math.pow(1.12,k);o.type='sine';o.frequency.value=f;o2.type='sine';o2.frequency.value=f*2;
 g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.045,t+.008);g.gain.exponentialRampToValueAtTime(.0001,t+.35);
 o.connect(g);o2.connect(g);g.connect(AC.destination);o.start(t);o2.start(t);o.stop(t+.4);o2.stop(t+.4)}catch(e){}}
function whoosh(k,ms){try{if(S.mute||!acOK())return;const t=AC.currentTime,d=ms/1000,o=AC.createOscillator(),fl=AC.createBiquadFilter(),g=AC.createGain();
 const f0=260*Math.pow(1.08,k);o.type='sawtooth';o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(f0*3.2,t+d);
 fl.type='lowpass';fl.Q.value=6;fl.frequency.setValueAtTime(500,t);fl.frequency.exponentialRampToValueAtTime(2600,t+d);
 g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.022,t+d*.35);g.gain.exponentialRampToValueAtTime(.012,t+d*.9);g.gain.exponentialRampToValueAtTime(.0001,t+d+.04);
 o.connect(fl);fl.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+.06)}catch(e){}}
/* lit: number of days reached (0-5); hot: day that just arrived */
function light(lit,hot){
 cur=lit;
 g.querySelectorAll('circle').forEach(el=>{
  const i=+el.dataset.d,pin=S.pin>=0;
  const on=pin?(i==S.pin&&lit>i):i<lit;
  const dimmed=pin&&i!=S.pin;
  el.setAttribute('fill',dimmed?'#9aa5b1':COL[i]);el.setAttribute('stroke','#fff');
  el.setAttribute('fill-opacity',on?'.3':(dimmed?'.04':'.08'));el.setAttribute('stroke-opacity',on?'1':(dimmed?'.3':'.55'));
  el.style.filter=on?'drop-shadow(0 0 6px '+COL[i]+')':'none';
  el.classList.toggle('on',on&&!still&&i!==hot);
  if(i===hot&&!still){el.classList.remove('pop');void el.getBBox();el.classList.add('pop')}});
 $('swa').querySelectorAll('circle').forEach(el=>{const i=+el.dataset.d,show=S.pin>=0?(i==S.pin&&lit>i):i<lit;el.style.display=show?'':'none';if(i===hot&&show&&!still){el.classList.remove('swpop');void el.getBBox();el.classList.add('swpop')}});
 $('nums').querySelectorAll('text').forEach(tx=>{const i=+tx.textContent-1;tx.style.opacity=(S.pin>=0&&i!=S.pin)?'.35':'1'});
 lg.querySelectorAll('.chip').forEach((c,i)=>{const pin=S.pin>=0;
  c.classList.toggle('sel',pin&&i==S.pin);c.classList.toggle('dim',pin&&i!=S.pin);c.classList.toggle('lit',!pin&&i<lit)});}
function drawArrow(prog){/* prog: segments travelled (float) */
 PROG=prog;const A=$('arw');while(A.firstChild)A.removeChild(A.firstChild);
 PATHS.forEach(Pt=>{const p=Pt.pts;if(p.length<2)return;const m=Math.min(prog,p.length-1);if(m<=0)return;
  const k=Math.floor(m),f=m-k,trail=p.slice(0,k+1);
  let h=p[k];if(f>0&&k+1<p.length){h=[p[k][0]+(p[k+1][0]-p[k][0])*f,p[k][1]+(p[k+1][1]-p[k][1])*f];trail.push(h)}
  const prev=trail.length>1?trail[trail.length-2]:p[0];const ang=Math.atan2(h[1]-prev[1],h[0]-prev[0]);
  const pt=trail.map(f4).join(' ');
  A.appendChild(sv2('polyline',{class:'ab',points:pt}));A.appendChild(sv2('polyline',{class:'af',points:pt}));
  const L1=px(22),W1=px(13),c=Math.cos(ang),s2=Math.sin(ang);
  const tip=[h[0]+c*L1*.55,h[1]+s2*L1*.55],bl=[h[0]-c*L1*.45-s2*W1,h[1]-s2*L1*.45+c*W1],br=[h[0]-c*L1*.45+s2*W1,h[1]-s2*L1*.45-c*W1];
  A.appendChild(sv2('polygon',{class:'ah',points:[tip,bl,br].map(f4).join(' ')}))})}
function redrawAnim(){drawArrow(PROG);light(cur)}
function maxSegs(){return PATHS.reduce((a,Pt)=>Math.max(a,Pt.pts.length-1),0)}
function dayAt(seg){for(const Pt of PATHS)if(Pt.days[seg-1]!=null)return Pt.days[seg-1];return seg-1}
function restart(){
 cancelAnimationFrame(RAF);clearInterval(timer);
 const N=maxSegs(),goal=S.pin>=0?Math.min(N,(PATHS[0]?PATHS[0].days.indexOf(S.pin):-1)+1||S.pin+1):N;
 if(!N){AN=null;drawArrow(0);light(0);return}
 if(still){AN=null;drawArrow(goal);light(S.pin>=0?S.pin+1:5);return}
 AN={t0:performance.now(),seg:0,goal};drawArrow(0);light(0);
 const step=now=>{const e=now-AN.t0,per=SEG+HOLD;
  if(AN.seg>=AN.goal){if(e>=END){AN.t0=now;AN.seg=0;drawArrow(0);light(0)}RAF=requestAnimationFrame(step);return}
  if(!AN.wh){AN.wh=1;if(S.tab==1)whoosh(dayAt(AN.seg+1),SEG)}
  const inSeg=Math.min(1,e/SEG);drawArrow(AN.seg+inSeg);
  if(e>=SEG&&!AN.arr){AN.arr=1;const d=dayAt(AN.seg+1);light(Math.max(cur,d+1),d);if(S.tab==1)ping(d)}
  if(e>=per){AN.seg++;AN.arr=0;AN.wh=0;AN.t0=now}
  RAF=requestAnimationFrame(step)};
 RAF=requestAnimationFrame(step)}
document.addEventListener('visibilitychange',()=>{if(document.hidden)cancelAnimationFrame(RAF);else restart()});
